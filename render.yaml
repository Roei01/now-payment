# Render Blueprint for the paper/live trading app in ./trading.
# One Starter web service runs the API, the mobile UI and the trading scheduler
# (RUN_WORKER_IN_WEB=true). The database is an external Postgres (e.g. Neon or
# Supabase free tier): paste its connection string as DATABASE_URL.
# To scale later: add a separate `type: worker` service with startCommand
# `npm run start:worker` and set RUN_WORKER_IN_WEB=false here.
services:
  - type: web
    name: trading-web
    runtime: node
    rootDir: trading
    plan: starter
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start:api
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: RUN_WORKER_IN_WEB
        value: "true"
      - key: APP_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: SETUP_TOKEN
        sync: false
      - key: MARKET_DATA_PROVIDER
        value: alpaca
      - key: MARKET_DATA_API_KEY
        sync: false
      - key: MARKET_DATA_API_SECRET
        sync: false
      - key: ALPACA_DATA_FEED
        value: iex
      - key: FX_PROVIDER
        value: frankfurter
      - key: SEC_EDGAR_USER_AGENT
        sync: false
      - key: AI_PROVIDER
        value: anthropic
      - key: AI_MANAGER_MODEL
        value: claude-opus-5
      - key: AI_API_KEY
        sync: false
      - key: AI_MONTHLY_BUDGET_ILS
        value: "60"
      - key: OPS_MONTHLY_CAP_ILS
        value: "150"
      - key: INFRA_MONTHLY_ESTIMATE_ILS
        value: "26"
      - key: NOTIFICATIONS_PROVIDER
        value: resend
      - key: NOTIFICATIONS_API_KEY
        sync: false
      - key: ALERT_EMAIL_TO
        sync: false
      - key: ALERT_EMAIL_FROM
        sync: false
      - key: DIGEST_HOUR_IL
        value: "23"
      - key: LIVE_TRADING_ENABLED
        value: "false"
