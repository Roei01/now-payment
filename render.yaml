# Render Blueprint for the paper/live trading app in ./trading.
# Creates: web (API + mobile UI), background worker (trading cycles), Postgres,
# and an Env Group with the non-secret settings shared by both services.
# Values marked `sync: false` are secrets: Render asks for them when the Blueprint is created.
# Enter the same secret values for the web service and the worker.
envVarGroups:
  - name: trading-settings
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_SECRET
        generateValue: true
      - key: MARKET_DATA_PROVIDER
        value: alpaca
      - key: ALPACA_DATA_FEED
        value: iex
      - key: FX_PROVIDER
        value: frankfurter
      - key: AI_PROVIDER
        value: anthropic
      - key: AI_MANAGER_MODEL
        value: claude-opus-5
      - key: AI_MONTHLY_BUDGET_ILS
        value: "60"
      - key: OPS_MONTHLY_CAP_ILS
        value: "150"
      - key: INFRA_MONTHLY_ESTIMATE_ILS
        value: "75"
      - key: NOTIFICATIONS_PROVIDER
        value: resend
      - key: DIGEST_HOUR_IL
        value: "23"
      - key: LIVE_TRADING_ENABLED
        value: "false"

services:
  - type: web
    name: trading-web
    runtime: node
    rootDir: trading
    plan: starter
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start:api
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: trading-db
          property: connectionString
      - fromGroup: trading-settings
      - key: MARKET_DATA_API_KEY
        sync: false
      - key: MARKET_DATA_API_SECRET
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: SEC_EDGAR_USER_AGENT
        sync: false
      - key: NOTIFICATIONS_API_KEY
        sync: false
      - key: ALERT_EMAIL_TO
        sync: false
      - key: ALERT_EMAIL_FROM
        sync: false
      - key: SETUP_TOKEN
        sync: false
  - type: worker
    name: trading-worker
    runtime: node
    rootDir: trading
    plan: starter
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start:worker
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: trading-db
          property: connectionString
      - fromGroup: trading-settings
      - key: MARKET_DATA_API_KEY
        sync: false
      - key: MARKET_DATA_API_SECRET
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: SEC_EDGAR_USER_AGENT
        sync: false
      - key: NOTIFICATIONS_API_KEY
        sync: false
      - key: ALERT_EMAIL_TO
        sync: false
      - key: ALERT_EMAIL_FROM
        sync: false

databases:
  - name: trading-db
    plan: basic-256mb
    databaseName: trading
